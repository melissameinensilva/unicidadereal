<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style">
<title>Hospedagens de Luxo</title>
</head>

<style>
* {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f4eb;
            color: #333;
            text-align: center;
        }

        header {
            background: #172c25;
            color: white;
            padding: 40px 15px;
        }

        header h1 {
            color: #d6b56d;
            margin-bottom: 15px;
        }

        .apresentacao {
            padding: 45px 20px;
        }

        h2 {
            color: #9b773c;
            margin-bottom: 20px;
        }

        .apresentacao p {
            max-width: 650px;
            margin: auto;
            line-height: 1.8;
        }

        .quartos {
            padding: 40px 20px;
            background: white;
        }

        .fotos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 850px;
            margin: auto;
        }

        .fotos img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
            transition: 0.3s;
        }

        .fotos img:hover {
            transform: scale(1.04);
        }

        .nav{
        display:flex ;
        gap: 30px;
        }

        .nav a{
            color: blueviolet;
            text-decoration: none;
            font-size:25px ;
            transition: 0.3s;
        }

        .nav :hover{
            color: blue;
            border-bottom:3px solid blue;
        padding-bottom: 6px;
        }

        footer {
            background: #172c25;
            color: white;
            padding: 35px 15px;
        }

        @media (max-width: 600px) {
            .fotos {
                grid-template-columns: 1fr;
            }
        }

</style>
<body>
    <div class="apresentação">
        <h1> Aqui mostramos os quartos para pessoas que gostam de coisas luxosas, mais caras e de qualidade</h1>
    <p></p>
    </div>

    <div class="fotos">
        <img src="quarto 1.jpg">
        <img src="quarto 2.jpg">
        <img src="quarto 3.jpg">
        <img src="quarto 4.jpg">

    </div>

<nav>
<a href="menu.html">início</a>
</nav>
    

    



</body>
</html>
